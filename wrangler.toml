name = "dj-system"
main = "src/index.tsx"
compatibility_date = "2026-09-01"

# public/ の CSS・JS をそのまま配信する
[assets]
directory = "./public"

# database_id は本番（Cloudflare）の D1。手元の wrangler dev は preview_database_id のほうを使うので、テスト用のデータとは混ざらない
[[d1_databases]]
binding = "DB"
database_name = "dj-system"
database_id = "89578df0-b956-40d5-82d5-5dfe6b270c92"
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 1分ごとに再生状態を確認し、止まっていたらデフォルトの曲を流し直す
[triggers]
crons = ["* * * * *"]
